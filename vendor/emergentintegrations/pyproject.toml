[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emergentintegrations"
version = "0.2.2"
description = "Emergent integrations library (vendored copy for self-hosted VPS installs)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["emergentintegrations*"]
